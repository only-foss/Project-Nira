[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "project-nira"
version = "0.1.0"
description = "Microplastics Detection Ecosystem"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "matplotlib>=3.7.0",
    "pandas>=1.5.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.2.0",
    "influxdb-client>=1.36.0",
    "numpy>=1.24.0"
]

[tool.setuptools]
packages = ["python"]
